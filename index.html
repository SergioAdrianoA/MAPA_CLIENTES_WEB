<!-- ===================================================== -->
<!-- INDEX.HTML -->
<!-- ===================================================== -->

<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>MAPA DE CLIENTES</title>

  <!-- ===================================================== -->
  <!-- LEAFLET -->
  <!-- ===================================================== -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"
  />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"
  />

  <!-- ===================================================== -->
  <!-- CSS -->
  <!-- ===================================================== -->

  <link
    rel="stylesheet"
    href="style.css?v=1.0.3"
  />

</head>

<body>

  <!-- ===================================================== -->
  <!-- TOPBAR -->
  <!-- ===================================================== -->

  <div class="topbar">

    <h1>MAPA DE CLIENTES</h1>

    <div class="filtros">

      <!-- BUSCA -->

      <input
        type="text"
        id="busca"
        placeholder="Buscar cliente..."
      />

      <!-- CIDADES -->

      <div class="dropdown">

        <button class="dropdown-btn">
          CIDADES
        </button>

        <div
          class="dropdown-content"
          id="cidadeFiltro"
        ></div>

      </div>

      <!-- BAIRROS -->

      <div class="dropdown">

        <button class="dropdown-btn">
          BAIRROS
        </button>

        <div
          class="dropdown-content"
          id="bairroFiltro"
        ></div>

      </div>

      <!-- RAMOS -->

      <div class="dropdown">

        <button class="dropdown-btn">
          RAMOS
        </button>

        <div
          class="dropdown-content"
          id="ramoFiltro"
        ></div>

      </div>

    </div>

  </div>

  <!-- ===================================================== -->
  <!-- MAPA -->
  <!-- ===================================================== -->

  <div id="map"></div>

  <!-- ===================================================== -->
  <!-- LEAFLET -->
  <!-- ===================================================== -->

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

  <!-- ===================================================== -->
  <!-- APP -->
  <!-- ===================================================== -->

  <script src="app.js?v=1.0.3"></script>

</body>

</html>
